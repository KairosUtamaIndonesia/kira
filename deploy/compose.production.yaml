name: kira

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kira
      POSTGRES_USER: ${KIRA_DATABASE_USER:?set KIRA_DATABASE_USER}
      POSTGRES_PASSWORD: ${KIRA_DATABASE_PASSWORD:?set KIRA_DATABASE_PASSWORD}
    volumes:
      - kira-postgres:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cliproxyapi:
    image: eceasy/cli-proxy-api:v7.3.7@sha256:4ce7b1b52f8d7e176c2047870a1f312ceb44a7e1b7aa7367dc80d6ffc9671fe7
    restart: unless-stopped
    volumes:
      - ${CLIPROXY_CONFIG_DIR:?set CLIPROXY_CONFIG_DIR}:/run/cliproxy-config:ro
      - cliproxyapi-auth:/root/.cli-proxy-api
    command: ['./CLIProxyAPI', '-config', '/run/cliproxy-config/config.yaml']
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    networks: [backend, egress]
    healthcheck:
      # Upstream's Debian image has bash but no curl/wget. This checks process
      # liveness only; Kira's /ready also checks the authenticated model catalog.
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/8317; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  server:
    image: ghcr.io/kairosutamindonesia/kira-server:${KIRA_SERVER_TAG:?set KIRA_SERVER_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KIRA_BASE_URL: ${KIRA_BASE_URL:?set KIRA_BASE_URL}
      KIRA_ENTRA_TENANT_ID: ${KIRA_ENTRA_TENANT_ID:?set KIRA_ENTRA_TENANT_ID}
      KIRA_ENTRA_CLIENT_ID: ${KIRA_ENTRA_CLIENT_ID:?set KIRA_ENTRA_CLIENT_ID}
      KIRA_ENTRA_CLIENT_SECRET: ${KIRA_ENTRA_CLIENT_SECRET:?set KIRA_ENTRA_CLIENT_SECRET}
      KIRA_AUTH_SECRET: ${KIRA_AUTH_SECRET:?set KIRA_AUTH_SECRET}
      KIRA_DATABASE_URL: postgres://${KIRA_DATABASE_USER:?set KIRA_DATABASE_USER}:${KIRA_DATABASE_PASSWORD:?set KIRA_DATABASE_PASSWORD}@postgres:5432/kira
      KIRA_POOL_URL: http://cliproxyapi:8317
      KIRA_POOL_KEY: ${KIRA_POOL_KEY:?set KIRA_POOL_KEY}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      cliproxyapi:
        condition: service_healthy
    expose: ['3000']
    networks: [backend, ingress]
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          'fetch("http://127.0.0.1:3000/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  kira-postgres:
  cliproxyapi-auth:

networks:
  backend:
    internal: true
  ingress:
    # Attach the deployment's reverse-proxy network here when required.
  egress:
    # CLIProxyAPI and the server need outbound provider/Entra access. The proxy
    # remains reachable by Kira only over the separate internal backend network.
