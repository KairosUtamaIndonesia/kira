name: CI

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira
          POSTGRES_DB: kira
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KIRA_ENTRA_TENANT_ID: 11111111-2222-3333-4444-555555555555
      KIRA_ENTRA_CLIENT_ID: ci-client
      KIRA_ENTRA_CLIENT_SECRET: ci-secret
      KIRA_AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci
      KIRA_BASE_URL: http://127.0.0.1:3000
      KIRA_DATABASE_URL: postgres://kira:kira@127.0.0.1:5439/kira
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun global cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check changed-file formatting
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.json' '*.md' '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#files[@]} == 0)); then
            echo "No formatable files changed."
          else
            bunx oxfmt --check "${files[@]}"
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  builds:
    name: Build applications
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun global cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        run: bun run build:desktop

      - name: Build admin
        run: bun run build:admin
