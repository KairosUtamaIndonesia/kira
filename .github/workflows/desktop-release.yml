name: Desktop Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.2

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--win nsis --x64'
          - platform: macos-latest
            args: '--mac dmg zip'
          - platform: ubuntu-latest
            args: '--linux AppImage --x64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun global cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        run: bun run --cwd apps/desktop dist -- --publish never ${{ matrix.args }}
        env:
          CSC_LINK: >-
            ${{ matrix.platform == 'windows-latest' && secrets.WINDOWS_CSC_LINK ||
            matrix.platform == 'macos-latest' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: >-
            ${{ matrix.platform == 'windows-latest' && secrets.WINDOWS_CSC_KEY_PASSWORD ||
            matrix.platform == 'macos-latest' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: apps/desktop/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release and update feed
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: feed
          merge-multiple: true

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: feed/**
          fail_on_unmatched_files: true

      - name: Checkout public update feed
        uses: actions/checkout@v4
        with:
          repository: KairosUtamaIndonesia/kira-updates
          ref: gh-pages
          token: ${{ secrets.KIRA_UPDATES_TOKEN }}
          path: update-site

      - name: Publish update feed
        run: |
          find update-site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R feed/. update-site/
          touch update-site/.nojekyll
          cd update-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Update feed is already current."
          else
            git commit -m "Publish Kira ${{ github.event.release.tag_name }} update feed"
            git push origin HEAD:gh-pages
          fi
