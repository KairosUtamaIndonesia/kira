# The database Kira's server keeps its own state in, for development and for
# tests. Production points KIRA_DATABASE_URL at a real instance instead; this
# exists so a checkout has somewhere to run.
#
# Its own port rather than Postgres's default, so it cannot collide with another
# project's Postgres on the same machine — docs/internal/server-development.md has
# the ports Kira claims and why.
#
# A named volume, so `docker compose down` does not throw away what was in it
# and `down -v` does.
services:
  postgres:
    image: postgres:18-alpine
    ports:
      - '5439:5432'
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira
      POSTGRES_DB: kira
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kira -d kira']
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres 18's image wants the mount one level up, at /var/lib/postgresql,
    # so the cluster lands in a version-named subdirectory and a future major
    # upgrade can use `pg_upgrade --link`. Mounting .../data is what the image
    # refuses to start on.
    volumes:
      # Keep the old volume key: renaming a Compose volume would otherwise make
      # Docker create a new empty cluster during the Foundry → Kira migration.
      - foundry-postgres:/var/lib/postgresql

volumes:
  foundry-postgres:
